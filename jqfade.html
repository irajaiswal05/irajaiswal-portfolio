<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Effects </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    
    <style>
        body {
            background-color: #FAFAFA;
            font-family: 'Poppins', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #111111;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        #status-text {
            color: #777777;
            font-size: 14px;
            margin-bottom: 30px;
            min-height: 21px; 
        }

        .image-frame {
            background-color: #EEEEEE;
            width: 100%;
            height: 300px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            overflow: hidden;
        }

        #studio-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; 
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: #111111;
            color: #FFFFFF;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Image Effects </h1>
        <p id="status-text">Ready. Please select an action.</p>
        
        <div class="image-frame">
            <img id="studio-image" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=600&auto=format&fit=crop">
        </div>

        <div class="controls">
            <button id="btn-in">Load Photo</button>
            <button id="btn-to">Ghost Filter</button>
            <button id="btn-out">Clear Photo</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            
            $("#btn-in").click(function() {
                $("#status-text").text("Fading in photo...");
                $("#studio-image").fadeIn(1000);
            });

            $("#btn-out").click(function() {
                $("#status-text").text("Fading out photo...");
                $("#studio-image").fadeOut(800);
            });

            $("#btn-to").click(function() {
                $("#status-text").text("Applying filter...");
                
                $("#studio-image").fadeTo(1200, 0.3, function() {
                    $("#status-text").text("Success: Ghost filter applied!");
                });
            });

        });
    </script>
</body>
</html>

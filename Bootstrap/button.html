<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creative Studio UI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f1115;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 60px;
            color: #e2e8f0;
        }

        .workspace-header {
            background: linear-gradient(180deg, #1a1d24 0%, #0f1115 100%);
            border-bottom: 1px solid #2d3748;
            padding: 2.5rem 0;
            margin-bottom: 3rem;
        }

        .status-display {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #38bdf8;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .panel-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2rem;
            height: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-grad-ocean {
            background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
            color: white;
            border: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        
        .btn-grad-amethyst {
            background: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
            color: white;
            border: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-grad-sunset {
            background: linear-gradient(135deg, #e11d48 0%, #f97316 100%);
            color: white;
            border: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-grad-midnight {
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%);
            color: white;
            border: 1px solid #475569;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }

        .dropdown-menu {
            background-color: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .dropdown-item {
            color: #e2e8f0;
            transition: background-color 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: #334155;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="workspace-header text-center">
        <div class="container">
            <h2 class="fw-bold mb-3" style="letter-spacing: 2px;">Creative Studio Panel</h2>
            <div class="status-display" id="live-status">
                Workspace Ready: Awaiting Interaction...
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row g-4">
            
            <div class="col-12 col-md-6">
                <div class="panel-box">
                    <h3 class="panel-title">Interactive Dropdown Menus</h3>
                    <div class="d-flex gap-3">
                        
                        <div class="dropdown">
                            <button class="btn btn-grad-ocean dropdown-toggle px-4" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Portfolio Assets
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="updateStatus('Viewing Web Templates')">Web Templates</a></li>
                                <li><a class="dropdown-item" href="#" onclick="updateStatus('Viewing Vector Illustrations')">Vector Illustrations</a></li>
                                <li><a class="dropdown-item" href="#" onclick="updateStatus('Viewing Brand Guidelines')">Brand Guidelines</a></li>
                            </ul>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-grad-sunset px-4" onclick="updateStatus('Opening Client Contact Form')">Contact Client</button>
                            <button type="button" class="btn btn-grad-sunset dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="visually-hidden">Toggle Dropdown</span>
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="updateStatus('Drafting New Email Message')">Send Email</a></li>
                                <li><a class="dropdown-item" href="#" onclick="updateStatus('Opening Meeting Calendar')">Schedule Meeting</a></li>
                                <li><hr class="dropdown-divider border-secondary"></li>
                                <li><a class="dropdown-item text-danger" href="#" onclick="updateStatus('Generating Feedback Request Form')">Request Feedback</a></li>
                            </ul>
                        </div>

                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="panel-box">
                    <h3 class="panel-title">Horizontally Stacked Group</h3>
                    <div class="btn-group w-100" role="group" aria-label="View Toggle">
                        <button type="button" class="btn btn-grad-midnight py-2" onclick="updateStatus('Layout Switched to Grid View')">Grid View</button>
                        <button type="button" class="btn btn-grad-midnight py-2" onclick="updateStatus('Layout Switched to List View')">List View</button>
                        <button type="button" class="btn btn-grad-midnight py-2" onclick="updateStatus('Layout Switched to Full Gallery')">Gallery View</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-8 mx-auto">
                <div class="panel-box text-center">
                    <h3 class="panel-title mb-4">Vertically Stacked Block Buttons</h3>
                    <div class="d-grid gap-3">
                        <button class="btn btn-grad-amethyst py-3 fw-bold fs-6" type="button" onclick="updateStatus('Exporting Design Assets (.ZIP)...')">Export Design Assets</button>
                        <button class="btn btn-grad-ocean py-3 fw-bold fs-6" type="button" onclick="updateStatus('Publishing Portfolio Updates to Live Site...')">Publish Live Portfolio</button>
                        <button class="btn btn-grad-midnight py-3 fw-bold fs-6" type="button" onclick="updateStatus('Synchronizing Files with Cloud Storage...')">Sync Cloud Storage</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateStatus(message) {
            const statusDisplay = document.getElementById('live-status');
            statusDisplay.style.transform = 'scale(1.05)';
            statusDisplay.style.color = '#ffffff';
            statusDisplay.style.backgroundColor = '#0284c7';
            
            statusDisplay.innerText = "Status: " + message;

            setTimeout(() => {
                statusDisplay.style.transform = 'scale(1)';
                statusDisplay.style.color = '#38bdf8';
                statusDisplay.style.backgroundColor = '#1e293b';
            }, 400);
        }
    </script>
</body>
</html>
